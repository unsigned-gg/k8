[workspace]
members = [
    "crates/k8",
    "crates/k8-core",
    "crates/k8-api",
    "crates/k8-orchestrator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["unsigned.gg <engineering@unsigned.gg>", "Christian M. Todie <chris@todie.io>"]
repository = "https://github.com/unsigned-gg/k8"
homepage = "https://unsigned.gg"
documentation = "https://docs.rs/k8"
readme = "README.md"

[workspace.dependencies]
k8-core = { path = "crates/k8-core", version = "0.1.0" }
k8-api = { path = "crates/k8-api", version = "0.1.0" }
k8-orchestrator = { path = "crates/k8-orchestrator", version = "0.1.0" }

kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
